name: AMASAMYA CI/CD Build & Test Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x amasamya/gradlew

      - name: Run Unit Tests
        run: |
          cd amasamya
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: |
          cd amasamya
          ./gradlew assembleDebug --stacktrace

      - name: Build Production Release App Bundle (.aab)
        run: |
          cd amasamya
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMASAMYA-Debug-APK
          path: amasamya/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMASAMYA-Release-AppBundle
          path: amasamya/app/build/outputs/bundle/release/app-release.aab
