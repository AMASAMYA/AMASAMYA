name: AMASAMYA CI/CD Build & Release Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test & Package Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x amasamya/gradlew

      - name: Run Unit Tests & WCAG 2.2 Rule Validations
        run: |
          cd amasamya
          ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint Compliance Audit
        run: |
          cd amasamya
          ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: |
          cd amasamya
          ./gradlew assembleDebug --stacktrace

      - name: Build Release App Bundle (.aab)
        run: |
          cd amasamya
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMASAMYA-Debug-APK
          path: amasamya/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMASAMYA-Release-AppBundle
          path: amasamya/app/build/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            amasamya/app/build/outputs/apk/debug/app-debug.apk
            amasamya/app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
